services:
  activityreporter:
    build: .
    image: activityreporter:latest
    container_name: activityreporter
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: activityreporter
      POSTGRES_USER: activityreporter
      POSTGRES_PASSWORD: activityreporter
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

  migrate:
    image: flyway/flyway:13.7.0
    container_name: migrate
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://timescaledb:5432/activityreporter
      FLYWAY_USER: activityreporter
      FLYWAY_PASSWORD: activityreporter
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      - timescaledb

  collector:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    image: activityreporter-collector:latest
    container_name: collector
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_CONNECTION_STRING: kafka:9092
      KAFKA_RAW_METRICS_TOPIC: raw_metrics
      COLLECTOR_ENDPOINTS: http://activityreporter:8080/metrics/
    depends_on:
      - kafka
      - activityreporter

  metrics-writer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    image: activityreporter-consumer:latest
    container_name: metrics-writer
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_CONNECTION_STRING: kafka:9092
      KAFKA_RAW_METRICS_TOPIC: raw_metrics
      KAFKA_CONSUMER_GROUP_ID: timescale-writer
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: activityreporter
      TIMESCALE_USER: activityreporter
      TIMESCALE_PASSWORD: activityreporter
    depends_on:
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  jobmanager:
    build:
      context: ./docker/flink
    image: activityreporter-flink:1.19.1
    container_name: flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      # Without a restart strategy a job fails for good on its first error,
      # e.g. when it starts before the collector has created its Kafka topic.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        restart-strategy.type: exponential-delay
    volumes:
      - ./flink-jobs:/opt/flink/jobs
    depends_on:
      - kafka

  taskmanager:
    build:
      context: ./docker/flink
    image: activityreporter-flink:1.19.1
    container_name: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink-jobs:/opt/flink/jobs
    depends_on:
      - jobmanager

  flink-jobs-submitter:
    build:
      context: ./docker/flink
    image: activityreporter-flink:1.19.1
    container_name: flink-jobs-submitter
    restart: "no"
    entrypoint: ["bash", "/opt/flink/submit-jobs.sh"]
    environment:
      KAFKA_CONNECTION_STRING: kafka:9092
      KAFKA_RAW_METRICS_TOPIC: raw_metrics
      KAFKA_PROCESSED_METRICS_TOPIC: processed_metrics
      # The Kafka connector jar is already in the image's /opt/flink/lib.
      KAFKA_CONNECTOR_JAR: ""
    volumes:
      - ./flink-jobs:/opt/flink/jobs:ro
      - ./src:/opt/flink/src:ro
      - ./docker/flink/submit-jobs.sh:/opt/flink/submit-jobs.sh:ro
    depends_on:
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  timescaledb-data:
