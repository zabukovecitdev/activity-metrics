services:
  agent:
    build: .
    image: activityreporter:latest
    container_name: agent
    command: agent
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      timeout: 10s
      retries: 10
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse-server
    restart: unless-stopped
    healthcheck:
      test: clickhouse-client -u $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD -q 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: metrics
      CLICKHOUSE_USER: user
      CLICKHOUSE_PASSWORD: password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  migrate:
    image: migrate/migrate:v4.20.1
    container_name: migrate
    entrypoint: ["sh", "-c", 'exec migrate -path /migrations -database "$$DATABASE_URL" "$$@"', "--"]
    command: ["up"]
    environment:
      DATABASE_URL: clickhouse://clickhouse:9000?username=user&password=password&database=metrics&x-multi-statement=true&x-migrations-table-engine=MergeTree
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      clickhouse:
        condition: service_healthy

  collector:
    build: .
    image: activityreporter:latest
    container_name: collector
    command: collector
    restart: unless-stopped
    # mDNS multicast doesn't cross the Docker bridge, so the collector joins the host's
    # network to discover clients on the LAN. Service names like "kafka" don't resolve
    # here, hence Kafka's host-published listener.
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_CONNECTION_STRING: localhost:9094
      KAFKA_RAW_METRICS_TOPIC: raw_metrics
      # Scraped in addition to clients discovered over mDNS, comma separated.
      COLLECTOR_ENDPOINTS: ""
    depends_on:
      - kafka
      - agent

  metrics-writer:
    build: .
    image: activityreporter:latest
    container_name: metrics-writer
    command: metrics-writer
    restart: unless-stopped
    environment: &clickhouse-writer-env
      PYTHONUNBUFFERED: "1"
      KAFKA_CONNECTION_STRING: kafka:9092
      KAFKA_TOPIC: raw_metrics
      KAFKA_CONSUMER_GROUP_ID: clickhouse-metrics-writer
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: metrics
      CLICKHOUSE_USER: user
      CLICKHOUSE_PASSWORD: password
    depends_on: &clickhouse-writer-depends-on
      kafka:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  anomalies-writer:
    build: .
    image: activityreporter:latest
    container_name: anomalies-writer
    command: anomalies-writer
    restart: unless-stopped
    environment:
      <<: *clickhouse-writer-env
      KAFKA_TOPIC: anomalies
      KAFKA_CONSUMER_GROUP_ID: clickhouse-anomalies-writer
    depends_on: *clickhouse-writer-depends-on

  jobmanager:
    build:
      context: ./docker/flink
    image: activityreporter-flink:1.19.1
    container_name: flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      # Without a restart strategy a job fails for good on its first error,
      # e.g. when it starts before the collector has created its Kafka topic.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        restart-strategy.type: exponential-delay
    depends_on:
      - kafka

  taskmanager:
    build:
      context: ./docker/flink
    image: activityreporter-flink:1.19.1
    container_name: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - jobmanager

  anomaly-detector-submitter:
    build:
      context: ./docker/flink
    image: activityreporter-flink:1.19.1
    container_name: anomaly-detector-submitter
    restart: "no"
    entrypoint: ["bash", "/opt/flink/submit-jobs.sh"]
    environment:
      KAFKA_CONNECTION_STRING: kafka:9092
      KAFKA_RAW_METRICS_TOPIC: raw_metrics
      KAFKA_ANOMALIES_TOPIC: anomalies
    volumes:
      - ./src:/opt/flink/src:ro
      - ./docker/flink/submit-jobs.sh:/opt/flink/submit-jobs.sh:ro
    depends_on:
      jobmanager:
        condition: service_started
      taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy

volumes:
  clickhouse_data:
