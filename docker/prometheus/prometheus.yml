global:
  scrape_interval: 15s

scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ["collector:8000"]
  - job_name: clickhouse-writer
    static_configs:
      - targets: ["clickhouse-writer:8000"]
  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager:9249"]
