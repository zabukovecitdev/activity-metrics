[project]
name = "activityreporter"
version = "0.1.0"
description = ""
authors = [
    {name = "Zabukovec",email = "rok.zabukovec@heureka.group"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psutil (>=7.2.2,<8.0.0)",
    "get-mac (>=0.9.2,<0.10.0)",
    "kafka-python (>=3.0.11,<4.0.0)",
    "py-machineid",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "requests (>=2.34.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "psycopg[binary] (>=3.2.10,<4.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
]

[project.scripts]
activityreporter = "client.main:cli"
metrics-writer = "consumers.main:main"
collector = "collector.main:cli"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client", "src/collector", "src/connectors", "src/consumers", "src/core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
