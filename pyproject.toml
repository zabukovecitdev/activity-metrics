[project]
name = "activityreporter"
version = "0.1.0"
description = ""
authors = [
    {name = "Zabukovec",email = "rok.zabukovec.it@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psutil (>=7.2.2,<8.0.0)",
    "kafka-python (>=3.0.11,<4.0.0)",
    "py-machineid",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "clickhouse-connect>=1.9.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
agent = "activityreporter.agent.main:cli"
collector = "activityreporter.collector.main:cli"
clickhouse-writer = "activityreporter.clickhouse_writer.main:cli"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]
# Notebook and Streamlit app. Local `uv sync` installs this group; the image passes `--no-default-groups`.
experiments = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.11.2",
    "streamlit>=1.64.0",
]

[tool.uv]
default-groups = ["dev", "experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activityreporter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

# pyflink only exists in the Flink image (its pemja dependency needs a JDK and doesn't build here).
[tool.pyright]
executionEnvironments = [
    { root = "src/activityreporter/anomaly_detector", extraPaths = ["src"], reportMissingImports = "none" },
    { root = "src" },
]
