[project]
name = "activity-metrics"
version = "0.1.0"
description = ""
authors = [
    {name = "Zabukovec",email = "rok.zabukovec.it@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psutil (>=7.2.2,<8.0.0)",
    "kafka-python (>=3.0.11,<4.0.0)",
    "py-machineid",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "clickhouse-connect>=1.9.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
agent = "activity_metrics.agent.main:cli"
collector = "activity_metrics.collector.main:cli"
clickhouse-writer = "activity_metrics.clickhouse_writer.main:cli"

[dependency-groups]
dev = [
    "complexipy>=9.0.0",
    "mutmut>=3.8.0",
    "pyright>=1.1.414",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff>=0.17.6",
]
# The notebook and Streamlit app in experiments/. Installed by `uv sync`, never by the image (`--no-default-groups`).
experiments = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.11.2",
    "streamlit>=1.64.0",
]

[tool.uv]
default-groups = ["dev", "experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activity_metrics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--ignore=mutants"
pythonpath = ["src"]

# `make mutate`. mutmut only copies the paths it mutates, so the rest of the package has to be listed in also_copy.
[tool.mutmut]
source_paths = ["src/activity_metrics/anomaly_detector/algorithms/", "src/activity_metrics/anomaly_detector/services/"]
pytest_add_cli_args_test_selection = ["tests/anomaly_detector/"]
also_copy = ["src/activity_metrics/__init__.py", "src/activity_metrics/anomaly_detector/__init__.py", "src/activity_metrics/anomaly_detector/models", "src/activity_metrics/shared", "tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15

# pyflink only exists in the Flink image (its pemja dependency needs a JDK and doesn't build here).
# anomaly_detector and shared run on Python 3.10: see docs/adr/0006-python-3-10-in-the-flink-image.md.
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
executionEnvironments = [
    { root = "src/activity_metrics/anomaly_detector", pythonVersion = "3.10", extraPaths = ["src"], reportMissingImports = "none" },
    { root = "src/activity_metrics/shared", pythonVersion = "3.10", extraPaths = ["src"] },
    { root = "src" },
]
