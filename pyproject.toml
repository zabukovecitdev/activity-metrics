[project]
name = "activityreporter"
version = "0.1.0"
description = ""
authors = [
    {name = "Zabukovec",email = "rok.zabukovec@heureka.group"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psutil (>=7.2.2,<8.0.0)",
    "kafka-python (>=3.0.11,<4.0.0)",
    "py-machineid",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "clickhouse-connect>=1.9.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
agent = "activityreporter.agent.main:cli"
collector = "activityreporter.collector.main:cli"
clickhouse-writer = "activityreporter.clickhouse_writer.main:cli"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]
# The notebook and Streamlit app in experiments/. Installed by `uv sync`, never by the image's `pip install .`.
experiments = [
    "ipykernel>=7.4.0",
    "ipympl>=0.10.0",
    "matplotlib>=3.11.2",
    "streamlit>=1.64.0",
]

[tool.uv]
default-groups = ["dev", "experiments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activityreporter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--ignore=mutants"
pythonpath = ["src"]

# `make mutate`. mutmut only copies the paths it mutates, so the rest of the package has to be listed in also_copy.
[tool.mutmut]
source_paths = ["src/activityreporter/anomaly_detector/algorithms/", "src/activityreporter/anomaly_detector/services/"]
pytest_add_cli_args_test_selection = ["tests/anomaly_detector/"]
also_copy = ["src/activityreporter/__init__.py", "src/activityreporter/anomaly_detector/__init__.py", "src/activityreporter/anomaly_detector/models", "src/activityreporter/shared", "tests"]
